name: Release

# Builds cross-platform binaries into a draft when you push a version tag like
# v0.1.0. Publication waits for the deliberate local native handoff. This does not publish anywhere else, does not
# touch any server, and does not run automatically on normal pushes.
#
# A manual run builds a dry-run draft. Local Darwin CI and exact-archive smoke
# must succeed before the separate Linux continuation assembles/signs. Dry-run
# continuation never publishes; signing stays opt-in because it writes public
# transparency records. No GitHub-hosted macOS runner is allocated.
#
# Third-party actions are pinned to a commit SHA (the tag is in the trailing
# comment) so a moved tag cannot change what runs in a release build.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sign:
        description: "Dry run: also run Sigstore signing and build attestation (publishes a public transparency-log record)"
        type: boolean
        default: false
      producer_run:
        description: "Continuation only: completed original build run ID"
        type: string
        default: ""
      producer_attempt:
        description: "Continuation only: exact original build attempt"
        type: string
        default: ""
      draft_id:
        description: "Continuation only: producer-created native handoff draft ID"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: cct-release-${{ inputs.draft_id || github.run_id }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    if: inputs.producer_run == '' && inputs.producer_attempt == '' && inputs.draft_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
      sign: ${{ steps.v.outputs.sign }}
    steps:
      # A tag push releases under its own name; a manual run builds a clearly
      # marked dry-run version so no artifact can be mistaken for a release.
      - name: Decide version and mode
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${GITHUB_REF_NAME}" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dryrun-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sign=${{ inputs.sign == true }}" >> "$GITHUB_OUTPUT"

      - name: Summarize
        shell: bash
        run: |
          echo "version=${{ steps.v.outputs.version }}"
          echo "is_release=${{ steps.v.outputs.is_release }}"

  dependencies:
    name: Package Go dependencies
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Gentoo's go-module.eclass consumes a module cache rooted at go-mod.
      - name: Package Go module cache
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          version="${version#v}"
          export GOMODCACHE="${PWD}/go-mod"
          go mod download -modcacherw
          go mod verify
          mkdir -p dist
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -I 'xz -T0 -9' -cf \
            "dist/codex-claude-transfer-${version}-deps.tar.xz" go-mod

      # Prove the archive is usable, not merely present: unpack it somewhere
      # else, point Go at it, and build with the network refused. GOPROXY=off
      # makes any attempt to fetch a module a hard error, and GOTOOLCHAIN=local
      # stops Go from downloading a different toolchain instead.
      - name: Build offline from the packaged dependencies
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          version="${version#v}"
          offline="$(mktemp -d)"
          tar -xf "dist/codex-claude-transfer-${version}-deps.tar.xz" -C "$offline"
          test -d "$offline/go-mod" || { echo "the archive has no go-mod root" >&2; exit 1; }
          rm -rf "${PWD}/go-mod"
          env -i PATH="$PATH" HOME="$HOME" \
            GOMODCACHE="$offline/go-mod" \
            GOFLAGS=-mod=mod \
            GOPROXY=off \
            GOSUMDB=off \
            GOTOOLCHAIN=local \
            go build -o "$offline/cct" ./cmd/cct
          "$offline/cct" version
          rm -rf "$offline"

      - name: Upload dependency artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-claude-transfer-go-dependencies
          path: dist/*-deps.tar.xz

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          version="${{ needs.meta.outputs.version }}"
          name="cct"
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          outdir="dist/${name}_${version}_${GOOS}_${GOARCH}"
          mkdir -p "$outdir"
          go build -trimpath -ldflags "-s -w -X github.com/ahmojo/codex-claude-transfer/internal/cli.Version=${version}" -o "$outdir/${name}${ext}" ./cmd/cct
          cp README.md docs/safety.md "$outdir/" 2>/dev/null || true
          ( cd dist && tar -czf "${name}_${version}_${GOOS}_${GOARCH}.tar.gz" "$(basename "$outdir")" )

      # The archive is what users download, so check its shape here rather than
      # discovering a missing doc or a non-executable binary after publishing.
      - name: Check the archive's contents and permissions
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          dir="cct_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          archive="dist/${dir}.tar.gz"
          bin="cct"
          if [ "${{ matrix.goos }}" = "windows" ]; then bin="cct.exe"; fi
          listing="$(tar -tzf "$archive")"
          echo "$listing"
          for want in "$dir/$bin" "$dir/README.md" "$dir/safety.md"; do
            printf '%s\n' "$listing" | grep -qx "$want" || { echo "missing from the archive: $want" >&2; exit 1; }
          done
          # Nothing outside the single top-level directory, so unpacking cannot
          # scatter files into the current folder.
          bad="$(printf '%s\n' "$listing" | grep -v "^${dir}\(/\|$\)" || true)"
          if [ -n "$bad" ]; then echo "entries outside ${dir}/:" >&2; echo "$bad" >&2; exit 1; fi
          modes="$(tar -tvzf "$archive")"
          echo "$modes"
          binmode="$(printf '%s\n' "$modes" | awk -v f="$dir/$bin" '$NF == f {print $1}')"
          case "$binmode" in
            -rwxr-xr-x) ;;
            *) echo "unexpected mode for $bin: $binmode (want -rwxr-xr-x)" >&2; exit 1 ;;
          esac
          if printf '%s\n' "$modes" | awk '{print $1}' | grep -q '^.....w\|^........w'; then
            echo "an archive entry is group- or world-writable" >&2; exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cct_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz

  smoke:
    name: Smoke-test ${{ matrix.goos }}/${{ matrix.goarch }} artifact
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, os: ubuntu-latest }
          - { goos: windows, goarch: amd64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cct_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist

      - name: Unpack and run the packaged binary end-to-end
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpack
          tar -xzf dist/*.tar.gz -C unpack
          bin="$(find unpack -type f \( -name cct -o -name cct.exe \) -print -quit)"
          if [ -z "$bin" ]; then echo "no cct binary found in the artifact" >&2; exit 1; fi
          echo "Testing packaged binary: $bin"
          bash scripts/smoke-artifact.sh "$bin"

  native-handoff:
    name: Prepare native handoff
    needs: [meta, build, smoke, dependencies]
    if: github.repository == 'DreamwareDevelopment/codex-claude-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # draft custody only; publication belongs to continuation
      actions: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare draft after portable qualification
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN: ${{ inputs.sign == true }}
        run: |
          set -euo pipefail
          args=()
          if [ "$SIGN" = true ]; then args+=(--sign); fi
          python3 scripts/native_release.py prepare --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" "${args[@]}"
      - name: Native handoff summary
        run: |
          echo 'Builds and Linux/Windows smoke completed. Assembly/signing/publication require the deliberate actual-Darwin operator handoff in docs/native-release.md.' >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify authenticated native handoff
    permissions:
      contents: write # GitHub exposes draft releases only to push-capable tokens
      actions: read
    if: github.repository == 'DreamwareDevelopment/codex-claude-transfer' && github.ref == 'refs/heads/Main' && (inputs.producer_run != '' || inputs.producer_attempt != '' || inputs.draft_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.proof.outputs.version }}
      is_release: ${{ steps.proof.outputs.is_release }}
      sign: ${{ steps.proof.outputs.sign }}
      draft_id: ${{ steps.proof.outputs.draft_id }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify proof against exact producer archives
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          DRAFT_ID: ${{ inputs.draft_id }}
        run: python3 scripts/native_release.py verify --run "$PRODUCER_RUN" --attempt "$PRODUCER_ATTEMPT" --draft "$DRAFT_ID" --output "$RUNNER_TEMP/native-qualified"

  assemble:
    name: Assemble release files
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # read the unpublished native handoff draft and its assets
      actions: read
      id-token: write # keyless (OIDC) Sigstore signing
      attestations: write # GitHub artifact attestations
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify native custody and download exact original archives
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          DRAFT_ID: ${{ inputs.draft_id }}
        run: python3 scripts/native_release.py verify --run "$PRODUCER_RUN" --attempt "$PRODUCER_ATTEMPT" --draft "$DRAFT_ID" --output dist

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/cct_${{ needs.verify.outputs.version }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz *.tar.xz *_sbom.spdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check the release file set
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          cd dist
          for want in \
            "cct_${version}_linux_amd64.tar.gz" \
            "cct_${version}_linux_arm64.tar.gz" \
            "cct_${version}_darwin_amd64.tar.gz" \
            "cct_${version}_darwin_arm64.tar.gz" \
            "cct_${version}_windows_amd64.tar.gz" \
            "cct_${version}_sbom.spdx.json" \
            "SHA256SUMS.txt"; do
            test -f "$want" || { echo "missing release file: $want" >&2; exit 1; }
          done
          ls -1 codex-claude-transfer-*-deps.tar.xz > /dev/null
          sha256sum -c SHA256SUMS.txt

      # Provenance: a Sigstore-signed checksum file plus a GitHub artifact
      # attestation, so every published asset is verifiable. Both write a public
      # record, so a dry run only does it when explicitly asked.
      - name: Install cosign
        if: needs.verify.outputs.is_release == 'true' || needs.verify.outputs.sign == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign checksum file (Sigstore keyless)
        if: needs.verify.outputs.is_release == 'true' || needs.verify.outputs.sign == 'true'
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.txt.sigstore.json \
            dist/SHA256SUMS.txt
          cosign verify-blob \
            --bundle dist/SHA256SUMS.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS.txt

      - name: Attest build provenance
        if: needs.verify.outputs.is_release == 'true' || needs.verify.outputs.sign == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/SHA256SUMS.txt

      - name: Upload the assembled release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files
          path: dist/*

      - name: Dry-run summary
        if: needs.verify.outputs.is_release != 'true'
        shell: bash
        run: |
          {
            echo "### Release dry run"
            echo
            echo "Built, smoke-tested and assembled \`${{ needs.verify.outputs.version }}\`."
            echo "No GitHub Release was created. Signing/attestation: \`${{ needs.verify.outputs.sign }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [verify, assemble]
    # Only a real version tag publishes. A manual dry run stops after assemble.
    if: needs.verify.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload files and publish the already qualified draft
      actions: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the assembled release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-files
          path: dist

      - name: Recheck exact source, native custody and assembled archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          python3 scripts/native_release.py verify --run "$PRODUCER_RUN" --attempt "$PRODUCER_ATTEMPT" --draft "$DRAFT_ID" --output "$RUNNER_TEMP/native-recheck" --compare dist
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload signed files and publish the qualified draft
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ needs.verify.outputs.draft_id }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$VERSION" dist/*.tar.gz dist/*.tar.xz dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sigstore.json dist/*_sbom.spdx.json --repo DreamwareDevelopment/codex-claude-transfer
          gh api --method PATCH "repos/DreamwareDevelopment/codex-claude-transfer/releases/$DRAFT_ID" -F draft=false -f name="$VERSION"
